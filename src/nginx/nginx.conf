# NeuronDB production reverse proxy
# Serves: NeuronDesktop frontend (/), NeuronDesktop API (/api), NeuronAgent (/agent-api)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Upstreams (Docker service names from docker-compose.prod.yml)
    upstream neurondesk_frontend {
        server neurondesk-frontend:3000;
    }
    upstream neurondesk_api {
        server neurondesk-api:8081;
    }
    upstream neuronagent {
        server neuronagent:8080;
    }

    server {
        listen 80;
        server_name _;

        # NeuronDesktop API (REST + WebSocket for MCP/Agent)
        location /api/ {
            proxy_pass http://neurondesk_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # NeuronAgent API (optional; for direct agent/session access)
        location /agent-api/ {
            proxy_pass http://neuronagent/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # NeuronDesktop frontend (Next.js)
        location / {
            proxy_pass http://neurondesk_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Optional: HTTPS server (uncomment and place certs in nginx/ssl/)
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     # ... same location blocks as above ...
    # }
}
