{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurondb.fullname" . }}-secrets
  labels:
    {{- include "neurondb.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.neurondb.postgresql.username | quote }}
  password: {{ include "neurondb.postgresPassword" . | quote }}
  {{- if .Values.secrets.agentApiKeys }}
  agent-api-keys: |
    {{- range .Values.secrets.agentApiKeys }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

