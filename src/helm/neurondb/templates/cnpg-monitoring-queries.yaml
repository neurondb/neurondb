{{- if and .Values.neurondb.enabled (not .Values.neurondb.postgresql.external.enabled) .Values.neurondb.cnpg.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neurondb.cnpgClusterName" . }}-monitoring
  labels:
    {{- include "neurondb.neurondb.labels" . | nindent 4 }}
data:
  queries: |
    # NeuronDB / CNPG custom Prometheus queries (postgres_exporter format)
    neurondb_active_connections:
      query: |
        SELECT datname, count(*) AS total
        FROM pg_catalog.pg_stat_activity
        WHERE state = 'active'
        GROUP BY datname
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - total:
            usage: "GAUGE"
            description: "Number of active connections"

    neurondb_replication_lag_bytes:
      primary: true
      query: |
        SELECT COALESCE(
          GREATEST(
            pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), sent_lsn),
            pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), write_lsn),
            pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), flush_lsn),
            pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), replay_lsn)
          ),
          0
        ) AS lag_bytes
        FROM pg_catalog.pg_stat_replication
        LIMIT 1
      metrics:
        - lag_bytes:
            usage: "GAUGE"
            description: "Replication lag behind primary in bytes"

    neurondb_database_size_bytes:
      query: |
        SELECT datname, pg_catalog.pg_database_size(datname) AS size_bytes
        FROM pg_catalog.pg_database
        WHERE datallowconn
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size_bytes:
            usage: "GAUGE"
            description: "Disk space used by the database in bytes"

    neurondb_max_connections_used:
      query: |
        SELECT datname, count(*) AS used, (SELECT setting::int FROM pg_catalog.pg_settings WHERE name = 'max_connections') AS max_conn
        FROM pg_catalog.pg_stat_activity
        GROUP BY datname
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - used:
            usage: "GAUGE"
            description: "Current number of connections"
        - max_conn:
            usage: "GAUGE"
            description: "max_connections setting"
{{- end }}
