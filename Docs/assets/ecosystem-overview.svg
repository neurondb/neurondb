<svg width="700" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000; }
      .label { font-family: Arial, sans-serif; font-size: 10px; fill: #000; }
      .small-label { font-family: Arial, sans-serif; font-size: 8px; fill: #000; }
      .box { stroke: #000; stroke-width: 1.5px; }
      .client-box { fill: #f5f5f5; }
      .service-box { fill: #fff; }
      .core-box { fill: #e1f5ff; }
      .ext-box { fill: #b3e5fc; }
      .arrow { stroke: #000; stroke-width: 1.5px; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#000" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="18" text-anchor="middle" class="title">Ecosystem Overview</text>
  
  <!-- Client Applications -->
  <rect x="15" y="40" width="130" height="85" class="box client-box" rx="4"/>
  <text x="80" y="58" text-anchor="middle" class="label" font-weight="bold">Client Applications</text>
  <text x="80" y="75" text-anchor="middle" class="small-label">CLI Tools</text>
  <text x="80" y="87" text-anchor="middle" class="small-label">Web Browser</text>
  <text x="80" y="99" text-anchor="middle" class="small-label">MCP Clients</text>
  <text x="80" y="111" text-anchor="middle" class="small-label">API Clients</text>
  
  <!-- Services -->
  <rect x="165" y="40" width="160" height="120" class="box service-box" rx="4"/>
  <text x="245" y="58" text-anchor="middle" class="label" font-weight="bold">NeuronDB Services</text>
  <rect x="175" y="65" width="140" height="25" class="box" fill="#f3e5f5" rx="2"/>
  <text x="245" y="78" text-anchor="middle" class="small-label">NeuronDesktop</text>
  <text x="245" y="88" text-anchor="middle" class="small-label" font-size="7px">Ports: 3000, 8081</text>
  <rect x="175" y="95" width="140" height="25" class="box" fill="#fff4e1" rx="2"/>
  <text x="245" y="108" text-anchor="middle" class="small-label">NeuronAgent</text>
  <text x="245" y="118" text-anchor="middle" class="small-label" font-size="7px">Port: 8080</text>
  <rect x="175" y="125" width="140" height="25" class="box" fill="#e8f5e9" rx="2"/>
  <text x="245" y="138" text-anchor="middle" class="small-label">NeuronMCP</text>
  <text x="245" y="148" text-anchor="middle" class="small-label" font-size="7px">stdio</text>
  
  <!-- Core Database -->
  <rect x="345" y="40" width="340" height="120" class="box core-box" rx="4"/>
  <text x="515" y="58" text-anchor="middle" class="label" font-weight="bold">Core Database</text>
  <rect x="355" y="65" width="320" height="45" class="box" fill="#e1f5ff" rx="2"/>
  <text x="515" y="82" text-anchor="middle" class="small-label">NeuronDB PostgreSQL</text>
  <text x="515" y="92" text-anchor="middle" class="small-label" font-size="7px">Port: 5433-5436</text>
  <rect x="355" y="115" width="320" height="40" class="box ext-box" rx="2"/>
  <text x="515" y="130" text-anchor="middle" class="small-label">NeuronDB Extension</text>
  <text x="515" y="140" text-anchor="middle" class="small-label" font-size="7px">Vector Search + ML</text>
  
  <!-- Arrows from Clients to Services -->
  <line x1="145" y1="85" x2="165" y2="78" class="arrow"/>
  <text x="152" y="78" class="small-label" font-size="7px">HTTP</text>
  <line x1="145" y1="105" x2="165" y2="138" class="arrow"/>
  <text x="152" y="120" class="small-label" font-size="7px">JSON-RPC</text>
  <line x1="80" y1="125" x2="80" y2="180" class="arrow"/>
  <text x="90" y="152" class="small-label" font-size="7px">SQL</text>
  <line x1="145" y1="115" x2="165" y2="108" class="arrow"/>
  <text x="152" y="108" class="small-label" font-size="7px">HTTP</text>
  
  <!-- Arrows from Services to Database -->
  <line x1="325" y1="78" x2="345" y2="85" class="arrow"/>
  <text x="332" y="78" class="small-label" font-size="7px">HTTP</text>
  <line x1="325" y1="88" x2="345" y2="90" class="arrow"/>
  <text x="332" y="90" class="small-label" font-size="7px">SQL</text>
  <line x1="325" y1="108" x2="345" y2="100" class="arrow"/>
  <text x="332" y="102" class="small-label" font-size="7px">SQL</text>
  <line x1="325" y1="138" x2="345" y2="105" class="arrow"/>
  <text x="332" y="120" class="small-label" font-size="7px">SQL</text>
  
  <!-- Arrow from DB to Extension -->
  <line x1="515" y1="110" x2="515" y2="115" class="arrow"/>
  
  <!-- Legend -->
  <rect x="15" y="180" width="670" height="230" class="box" fill="#fafafa" rx="4" stroke-dasharray="2,2"/>
  <text x="350" y="198" text-anchor="middle" class="label" font-weight="bold">Component Details</text>
  
  <!-- Service details -->
  <text x="25" y="220" class="label" font-weight="bold">Services:</text>
  <rect x="25" y="228" width="12" height="12" fill="#f3e5f5" stroke="#000" stroke-width="1"/>
  <text x="42" y="237" class="small-label">NeuronDesktop - Web UI + API (Ports: 3000, 8081)</text>
  <rect x="25" y="245" width="12" height="12" fill="#fff4e1" stroke="#000" stroke-width="1"/>
  <text x="42" y="254" class="small-label">NeuronAgent - REST/WebSocket API (Port: 8080)</text>
  <rect x="25" y="262" width="12" height="12" fill="#e8f5e9" stroke="#000" stroke-width="1"/>
  <text x="42" y="271" class="small-label">NeuronMCP - MCP Protocol Server (stdio)</text>
  
  <!-- Database details -->
  <text x="25" y="295" class="label" font-weight="bold">Database:</text>
  <rect x="25" y="303" width="12" height="12" fill="#e1f5ff" stroke="#000" stroke-width="1"/>
  <text x="42" y="312" class="small-label">NeuronDB PostgreSQL (Port: 5433-5436)</text>
  <rect x="25" y="320" width="12" height="12" fill="#b3e5fc" stroke="#000" stroke-width="1"/>
  <text x="42" y="329" class="small-label">NeuronDB Extension - Vector Search + ML</text>
  
  <!-- Connection details -->
  <text x="25" y="355" class="label" font-weight="bold">Connections:</text>
  <text x="42" y="372" class="small-label">• CLI Tools → Database: SQL</text>
  <text x="42" y="385" class="small-label">• Web Browser → NeuronDesktop: HTTP</text>
  <text x="42" y="398" class="small-label">• MCP Clients → NeuronMCP: JSON-RPC</text>
  <text x="42" y="411" class="small-label">• API Clients → NeuronAgent: HTTP</text>
</svg>
