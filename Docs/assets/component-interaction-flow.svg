<svg width="700" height="380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000; }
      .actor-label { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #000; }
      .message-label { font-family: Arial, sans-serif; font-size: 9px; fill: #000; font-weight: 500; }
      .box { stroke: #000; stroke-width: 1.5px; fill: #fff; }
      .actor-box { fill: #f0f0f0; }
      .arrow { stroke: #000; stroke-width: 1.5px; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #000; stroke-width: 1.5px; fill: none; stroke-dasharray: 4,4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#000" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="18" text-anchor="middle" class="title">Component Interaction Flow</text>
  
  <!-- Actors -->
  <rect x="20" y="40" width="90" height="300" class="box actor-box" rx="4"/>
  <text x="65" y="62" text-anchor="middle" class="actor-label">User</text>
  <line x1="65" y1="70" x2="65" y2="330" stroke="#000" stroke-width="1"/>
  
  <rect x="130" y="40" width="110" height="300" class="box actor-box" rx="4"/>
  <text x="185" y="62" text-anchor="middle" class="actor-label">NeuronDesktop</text>
  <line x1="185" y1="70" x2="185" y2="330" stroke="#000" stroke-width="1"/>
  
  <rect x="260" y="40" width="110" height="300" class="box actor-box" rx="4"/>
  <text x="315" y="62" text-anchor="middle" class="actor-label">NeuronAgent</text>
  <line x1="315" y1="70" x2="315" y2="330" stroke="#000" stroke-width="1"/>
  
  <rect x="390" y="40" width="110" height="300" class="box actor-box" rx="4"/>
  <text x="445" y="62" text-anchor="middle" class="actor-label">NeuronMCP</text>
  <line x1="445" y1="70" x2="445" y2="330" stroke="#000" stroke-width="1"/>
  
  <rect x="520" y="40" width="90" height="300" class="box actor-box" rx="4"/>
  <text x="565" y="62" text-anchor="middle" class="actor-label">NeuronDB</text>
  <line x1="565" y1="70" x2="565" y2="330" stroke="#000" stroke-width="1"/>
  
  <!-- Interaction 1: User accesses Web UI -->
  <line x1="65" y1="100" x2="185" y2="100" class="arrow"/>
  <text x="120" y="95" class="message-label" fill="#000">Access Web UI</text>
  
  <line x1="185" y1="115" x2="565" y2="115" class="arrow"/>
  <text x="370" y="110" class="message-label" fill="#000">Query vector data</text>
  
  <line x1="565" y1="130" x2="185" y2="130" class="dashed-arrow"/>
  <text x="370" y="125" class="message-label" fill="#000">Return results</text>
  
  <!-- Interaction 2: User creates agent task -->
  <line x1="65" y1="165" x2="185" y2="165" class="arrow"/>
  <text x="120" y="160" class="message-label" fill="#000">Create agent task</text>
  
  <line x1="185" y1="180" x2="315" y2="180" class="arrow"/>
  <text x="245" y="175" class="message-label" fill="#000">POST /api/v1/agents</text>
  
  <line x1="315" y1="195" x2="565" y2="195" class="arrow"/>
  <text x="435" y="190" class="message-label" fill="#000">Store agent state</text>
  
  <line x1="315" y1="210" x2="565" y2="210" class="arrow"/>
  <text x="435" y="205" class="message-label" fill="#000">Vector search (memory)</text>
  
  <line x1="565" y1="225" x2="315" y2="225" class="dashed-arrow"/>
  <text x="435" y="220" class="message-label" fill="#000">Context results</text>
  
  <line x1="315" y1="240" x2="185" y2="240" class="dashed-arrow"/>
  <text x="245" y="235" class="message-label" fill="#000">Agent response</text>
  
  <!-- Interaction 3: MCP client request -->
  <line x1="65" y1="285" x2="445" y2="285" class="arrow"/>
  <text x="250" y="280" class="message-label" fill="#000">MCP client request</text>
  
  <line x1="445" y1="300" x2="565" y2="300" class="arrow"/>
  <text x="500" y="295" class="message-label" fill="#000">Execute tool (vector search)</text>
  
  <line x1="565" y1="315" x2="445" y2="315" class="dashed-arrow"/>
  <text x="500" y="310" class="message-label" fill="#000">Results</text>
  
  <line x1="445" y1="330" x2="65" y2="330" class="dashed-arrow"/>
  <text x="250" y="325" class="message-label" fill="#000">Tool response</text>
  
  <!-- Legend -->
  <rect x="20" y="350" width="590" height="25" class="box" fill="#fafafa" rx="3" stroke-dasharray="2,2"/>
  <line x1="35" y1="362" x2="80" y2="362" class="arrow"/>
  <text x="90" y="367" class="message-label" font-size="8px">Request</text>
  <line x1="170" y1="362" x2="215" y2="362" class="dashed-arrow"/>
  <text x="225" y="367" class="message-label" font-size="8px">Response</text>
</svg>
