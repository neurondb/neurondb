# SQL corpus (run_test.py): PR subset + scheduled broader run.
name: SQL tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"

jobs:
  sql-pr:
    name: SQL subset (PR)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential make libssl-dev libcurl4-openssl-dev

      - name: Start PostgreSQL
        run: sudo pg_ctlcluster 17 main start

      - name: Build and install extension
        run: |
          make -j"$(nproc)"
          sudo make install

      - name: Create database and extension
        run: |
          sudo -u postgres createdb neurondb_ci || true
          sudo -u postgres psql -d neurondb_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS neurondb;"

      - name: Basic/core SQL tests
        run: |
          cd src/tests
          sudo -u postgres env NDB_CI_SKIP_LIVE=1 ./run_test.py --category basic --module core --db neurondb_ci

      - name: Sample negative SQL test
        run: |
          cd src/tests
          sudo -u postgres env NDB_CI_SKIP_LIVE=1 ./run_test.py --category negative --test 001_linreg_negative --db neurondb_ci

  sql-nightly:
    name: SQL corpus (nightly, skip live)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential make libssl-dev libcurl4-openssl-dev

      - name: Start PostgreSQL
        run: sudo pg_ctlcluster 17 main start

      - name: Build and install extension
        run: |
          make -j"$(nproc)"
          sudo make install

      - name: Create database and extension
        run: |
          sudo -u postgres createdb neurondb_ci || true
          sudo -u postgres psql -d neurondb_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS neurondb;"

      - name: All SQL tests (excluding live_required)
        run: |
          cd src/tests
          sudo -u postgres env NDB_CI_SKIP_LIVE=1 ./run_test.py --category all --db neurondb_ci
