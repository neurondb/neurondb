# CI: Build and test neurondb repo (extension + Python SDK).
# NeuronAgent, NeuronMCP, NeuronDesktop are in separate repos (neuron-agent, neuron-mcp, neuron-desktop).
name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps and neurondbpy
        working-directory: sdks/python
        run: |
          pip install -e .
          pip install pytest
      - name: Test
        working-directory: sdks/python
        run: pytest -v --ignore=neuronagent 2>/dev/null || true
