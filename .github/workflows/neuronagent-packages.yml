name: NeuronAgent - Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot build-essential

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version || '1.0.0' }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build NeuronAgent DEB
        run: |
          export PATH="$PATH:/usr/local/go/bin"
          cd packaging/deb/neuronagent
          VERSION=${{ steps.version.outputs.version }} ./build.sh

      - name: Generate checksums
        run: |
          cd packaging/deb
          find . -name "neuronagent*.deb" -exec sha256sum {} \; > SHA256SUMS-neuronagent
          cat SHA256SUMS-neuronagent

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuronagent-deb-packages
          path: |
            packaging/deb/neuronagent/*.deb
            packaging/deb/SHA256SUMS-neuronagent
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packaging/deb/neuronagent/*.deb
            packaging/deb/SHA256SUMS-neuronagent
          body: |
            NeuronAgent Release ${{ steps.version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Installation

            Install with:
            ```bash
            sudo dpkg -i neuronagent_${{ steps.version.outputs.version }}_amd64.deb
            sudo apt-get install -f
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio make gcc

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version || '1.0.0' }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build RPM packages
        run: |
          echo "RPM build placeholder - implement when RPM spec files are complete"
          # cd packaging/rpm/neuronagent
          # VERSION=${{ steps.version.outputs.version }} ./build.sh

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packaging/rpm/neuronagent/*.rpm
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

