# NeuronAgent: golangci-lint configuration
# Run: golangci-lint run ./...
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
  disable:
    - deadcode
linters-settings:
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
