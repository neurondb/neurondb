{{- if .Values.hubDb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neurondb-hub.name" . }}-hub-db
  labels:
    {{- include "neurondb-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "neurondb-hub.name" . }}
      app.kubernetes.io/component: hub-db
  template:
    metadata:
      labels:
        {{- include "neurondb-hub.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub-db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.hubDb.image.repository }}:{{ .Values.hubDb.image.tag }}"
          ports:
            - containerPort: {{ .Values.hubDb.port }}
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.hubDb.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.hubDb.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "neurondb-hub.secretName" . }}
                  key: HUB_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", .Values.hubDb.auth.username]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", .Values.hubDb.auth.username]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "neurondb-hub.fullname" . }}-hub-db-pvc
{{- end }}
