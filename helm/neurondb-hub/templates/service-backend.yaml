{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neurondb-hub.name" . }}-backend
  labels:
    {{- include "neurondb-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "neurondb-hub.name" . }}
    app.kubernetes.io/component: backend
{{- end }}
