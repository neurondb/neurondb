{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neurondb-hub.name" . }}-gateway
  labels:
    {{- include "neurondb-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "neurondb-hub.name" . }}
    app.kubernetes.io/component: gateway
{{- end }}
