{{- if and .Values.secrets.create (not .Values.secrets.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurondb-hub.fullname" . }}-secrets
  labels:
    {{- include "neurondb-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ include "neurondb-hub.databaseUrl" . | quote }}
  NEURONAGENT_ENDPOINT: {{ .Values.secrets.neuronagentEndpoint | quote }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeProPriceId }}
  STRIPE_PRO_PRICE_ID: {{ .Values.secrets.stripeProPriceId | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.hubDb.enabled }}
  HUB_DB_PASSWORD: {{ .Values.secrets.hubDbPassword | default .Values.hubDb.auth.password | quote }}
  {{- end }}
{{- end }}
