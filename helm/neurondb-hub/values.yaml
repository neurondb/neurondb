# Default values for neurondb-hub

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []

# Hub backend (Go API)
backend:
  enabled: true
  image:
    repository: neurondb-hub-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8081
  env:
    PORT: "8081"
    # DATABASE_URL, JWT_SECRET, NEURONAGENT_ENDPOINT, etc. from secret or values
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 5

# Hub gateway (reverse proxy + API key validation)
gateway:
  enabled: true
  image:
    repository: neurondb-hub-gateway
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8084
  env: {}
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Hub frontend (Next.js)
frontend:
  enabled: true
  image:
    repository: neurondb-hub-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  env: {}
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# PostgreSQL for Hub (when not using external DB)
hubDb:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  auth:
    username: neuronhub
    database: neuronhub
    password: ""  # set via secrets.hubDbPassword when secrets.create=true
  persistence:
    size: 10Gi
    storageClass: ""
  port: 5432

# Secrets: set create true and provide values (or use existingSecretName)
secrets:
  create: true
  # Use existingSecretName to reference an existing secret instead of creating one
  existingSecretName: ""
  # When create=true, these are used (prefer mounting from external secret manager in prod)
  jwtSecret: ""
  databaseUrl: ""
  neuronagentEndpoint: "http://neuronagent:8080"
  stripeSecretKey: ""
  stripeProPriceId: ""
  stripeWebhookSecret: ""
  hubDbPassword: ""  # used when hubDb.enabled and secrets.create
